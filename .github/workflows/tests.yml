name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check dependency consistency
        run: pip check
      - name: Reject desktop OpenCV in production
        run: python -c "import importlib.metadata as m; names={d.metadata['Name'].lower() for d in m.distributions()}; assert 'opencv-python' not in names, 'Use opencv-python-headless only'"
      - name: Run tests
        run: python -m pytest tests/unit -q

  streamlit-cloud-smoke:
    runs-on: ubuntu-latest
    container: python:3.11-slim-trixie
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      STREAMLIT_CLOUD: "true"
      RUNTIME_DIR: /tmp/parcel-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install Streamlit Cloud system dependencies
        run: |
          apt-get update
          xargs -r apt-get install -y < packages.txt
      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
      - name: Check dependency consistency
        run: pip check
      - name: Reject desktop OpenCV in production
        run: python -c "import importlib.metadata as m; names={d.metadata['Name'].lower() for d in m.distributions()}; assert 'opencv-python' not in names, 'Use opencv-python-headless only'"
      - name: Verify imports and real Streamlit startup
        run: python -m pytest tests/unit/test_streamlit_smoke.py -q
